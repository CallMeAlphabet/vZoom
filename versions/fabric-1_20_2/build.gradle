// fabric-1_20_2 -- Mojang official mappings, fabric-loom-remap, Java 17.
plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT'
}

base { archivesName = "vzoom-fabric-1_20_2" }

loom {
    mods {
        "vzoom" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.findProperty('mc_fabric-1_20_2')}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.findProperty('loader_fabric-1_20_2')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.findProperty('fapi_fabric-1_20_2')}"
    modCompileOnlyApi("com.terraformersmc:modmenu:${rootProject.findProperty('modmenu_fabric-1_20_2')}") { transitive = false }
    implementation project(':core')
}

int jv = Integer.parseInt(rootProject.findProperty('java_fabric-1_20_2').toString())

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xlint:-options" << "-Xlint:-deprecation"
    options.release = jv
}

configurations.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, jv)
}

jar {
    dependsOn ':core:classes'
    from { project(':core').sourceSets.main.output }
}

java {
    sourceCompatibility = JavaVersion.toVersion(jv)
    targetCompatibility = JavaVersion.toVersion(jv)
}
