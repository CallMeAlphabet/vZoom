// fabric-26_1 -- NoRemap Loom (26.x ships Mojmap). Java 25.
plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

base { archivesName = "vzoom-fabric-26_1" }

loom {
    mods {
        "vzoom" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.findProperty('mc_fabric-26_1')}"
    implementation "net.fabricmc:fabric-loader:${rootProject.findProperty('loader_fabric-26_1')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.findProperty('fapi_fabric-26_1')}"
    implementation "net.fabricmc.fabric-api:fabric-key-mapping-api-v1:2.0.5+e2bdee789e"
    compileOnly("com.terraformersmc:modmenu:${rootProject.findProperty('modmenu_fabric-26_1')}") { transitive = false }
    implementation project(':core')
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xlint:-options" << "-Xlint:-deprecation"
    options.release = 25
}

jar {
    dependsOn ':core:classes'
    from { project(':core').sourceSets.main.output }
}

java {
    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)
}

configurations.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
}
