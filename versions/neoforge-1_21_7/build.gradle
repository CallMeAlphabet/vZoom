plugins {
    id 'java'
}

base { archivesName = "vzoom-neoforge-1_21_7" }

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://libraries.minecraft.net' }
    maven { url = 'https://maven.fabricmc.net/' }
}

File mcJar = null
def loom = new File(gradle.gradleUserHomeDir, 'caches/fabric-loom')
loom.eachFileRecurse { j ->
    if (!j.name.startsWith('minecraft-merged') || !j.name.endsWith('.jar')) return
    if (j.name.contains('sources') || j.name.contains('intermediary')) return
    if (!j.path.contains('minecraftMaven')) return
    def p = j.parentFile
    while (p != null) {
        if (p.name == '1.21.7' || p.name.startsWith('1.21.7-')) { mcJar = j; return }
        p = p.parentFile
    }
}
if (mcJar == null) throw new GradleException("No loom merged jar for 1.21.7; build the fabric module for 1.21.7 first")

dependencies {
    compileOnly "net.fabricmc:fabric-loader:0.16.14"
    implementation files(mcJar)
implementation "net.neoforged:neoforge:21.7.25-beta:universal"
        implementation "org.joml:joml:1.10.5"
    implementation "net.neoforged.fancymodloader:language-java:1.0.16"
    implementation "net.neoforged.fancymodloader:loader:3.0.45"
    implementation "net.neoforged:bus:7.2.0"
    implementation "net.neoforged:mergetool:2.0.7:api"
    implementation "net.fabricmc:sponge-mixin:0.15.5+mixin.0.8.7"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "com.mojang:brigadier:1.2.9"
    implementation "com.mojang:datafixerupper:8.0.16"
    implementation "com.google.guava:guava:32.1.2-jre"
    implementation "it.unimi.dsi:fastutil:8.5.12"
    implementation "org.slf4j:slf4j-api:2.0.9"
    implementation project(':core')
}

processResources {
    inputs.property "version", project.version
    filesMatching("neoforge.mods.toml") { expand "version": project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xlint:-options" << "-Xlint:-deprecation"
    options.release = 21
}

jar {
    dependsOn ':core:classes'
    from { project(':core').sourceSets.main.output }
}
