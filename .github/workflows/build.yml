name: Build

# Rebuilds every module whenever anything except README.md / LICENSE changes.
# Jars are parsed out of Gradle's output names, labeled with loader
# (Fabric / NeoForge) + Minecraft version, uploaded as workflow artifacts,
# and pushed to a rolling "latest" release on pushes to main.

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Gradle build (all modules)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle (caches dependencies + Loom MC jars across runs)
        uses: gradle/actions/setup-gradle@v4

      # NOTE: the NeoForge modules compile against the Mojang-mapped Minecraft
      # jar that Loom caches while the Fabric modules are CONFIGURED, so all
      # modules must be built in one invocation (Gradle configures the
      # fabric-* projects before the neoforge-* projects).
      - name: Build
        run: ./gradlew -Dorg.gradle.internal.repository.max.tentatives=10 build --max-workers=3 --stacktrace

      - name: Collect and label jars
        id: jars
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob

          jars=(versions/*/build/libs/vzoom-*.jar)
          modules=$(find versions -mindepth 1 -maxdepth 1 -type d | wc -l)
          found=${#jars[@]}
          if [ "$found" -ne "$modules" ]; then
            echo "::error::Expected $modules module jars, found $found in versions/*/build/libs"
            exit 1
          fi

          echo "## Built jars" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Label | File |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          modver=""
          for jar in "${jars[@]}"; do
            case "$jar" in *-sources.jar) continue ;; esac
            base=$(basename "$jar" .jar)     # e.g. vzoom-fabric-1_14-1.2.0
            rest=${base#vzoom-}              # fabric-1_14-1.2.0
            modver=${rest##*-}               # 1.2.0
            middle=${rest%-"$modver"}        # fabric-1_14
            loader=${middle%%-*}             # fabric | neoforge
            mc=${middle#*-}                  # 1_14
            mc=${mc//_/.}                    # 1.14

            case "$loader" in
              fabric)   label=Fabric ;;
              neoforge) label=NeoForge ;;
              *)        label=$loader ;;
            esac

            out="vzoom-${modver}-${label}-${mc}.jar"
            cp "$jar" "dist/$out"
            echo "| $label $mc | \`$out\` |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "modver=$modver" >> "$GITHUB_OUTPUT"
          echo "Packaged $(ls dist | wc -l) labeled jars (mod version $modver)."

      - name: Upload labeled jars
        uses: actions/upload-artifact@v4
        with:
          name: vzoom-${{ steps.jars.outputs.modver }}-jars
          path: dist/*.jar
          if-no-files-found: error

  release:
    name: Update rolling "latest" release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download labeled jars
        uses: actions/download-artifact@v4
        with:
          pattern: vzoom-*-jars
          merge-multiple: true
          path: dist

      - name: Publish to rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Latest development builds" \
              --notes "Automated builds from \`main\`. Use a version tag (e.g. \`v1.2.0\`) for stable releases."
          gh release upload latest --repo "$GITHUB_REPOSITORY" --clobber dist/*.jar
          echo "Pushed $(ls dist | wc -l) jars to the 'latest' release."

  modrinth:
    name: Publish to Modrinth
    needs: build
    # Runs after every recompile that lands on main and on every release,
    # so Modrinth always tracks main. Version bumps (e.g. 1.3.0) appear as
    # new Modrinth versions automatically; existing version numbers are
    # skipped (Modrinth keeps what it has until the version changes).
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Modrinth project slug: modrinth.com/mod/vextolyzoom
      MODRINTH_PROJECT: vextolyzoom
    steps:
      - name: Download labeled jars
        uses: actions/download-artifact@v4
        with:
          pattern: vzoom-*-jars
          merge-multiple: true
          path: dist

      - name: Publish each labeled jar as a Modrinth version
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          if [ -z "${MODRINTH_TOKEN:-}" ]; then
            echo "::warning::Secret MODRINTH_TOKEN is not set - skipping Modrinth publishing."
            echo "Create a PAT at https://modrinth.com/settings/pats (with write scopes) and add"
            echo "it as the repository secret MODRINTH_TOKEN (Settings > Secrets and variables > Actions)."
            exit 0
          fi

          if [ -n "${CHANGELOG:-}" ]; then
            :
          else
            CHANGELOG="Automated build from main: https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          fi
          changelog="${CHANGELOG:0:2000}"

          shopt -s nullglob
          jars=(dist/vzoom-*.jar)
          echo "Publishing ${#jars[@]} versions to Modrinth project '$MODRINTH_PROJECT'..."

          published=0
          existed=0
          failed=0
          for jar in "${jars[@]}"; do
            base=$(basename "$jar" .jar)   # e.g. vzoom-1.2.0-Fabric-1.14
            rest=${base#vzoom-}
            modver=${rest%%-*}             # 1.2.0
            middle=${rest#*-}              # Fabric-1.14
            loader=$(echo "${middle%%-*}" | tr 'A-Z' 'a-z')
            mc=${middle#*-}

            data=$(jq -n \
              --arg name "vZoom $base" \
              --arg version_number "$modver+$loader-$mc" \
              --arg changelog "$changelog" \
              --arg loader "$loader" \
              --arg mc "$mc" \
              --arg base "$base" \
              '{name: $name, version_number: $version_number, changelog: $changelog,
                dependencies: [], game_versions: [$mc], loaders: [$loader],
                featured: false, status: "listed", requested_status: "listed",
                release_channel: "release", file_parts: [$base]}')
            http=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
              -X POST "https://api.modrinth.com/v2/version" \
              -H "Authorization: $MODRINTH_TOKEN" \
              -H "User-Agent: CallMeAlphabet/vZoom (https://github.com/CallMeAlphabet/vZoom)" \
              -F "data=$data" \
              -F "$base=@$jar")

            case "$http" in
              200|201)
                echo "Published: $base"
                published=$((published+1))
                ;;
              400)
                if grep -qi "already.exist" /tmp/resp.json; then
                  echo "Already on Modrinth (same version number): $base"
                  existed=$((existed+1))
                else
                  echo "::error::Modrinth rejected $base (HTTP 400):"
                  cat /tmp/resp.json; echo; failed=$((failed+1))
                fi
                ;;
              *)
                echo "::error::Modrinth upload failed for $base (HTTP $http):"
                cat /tmp/resp.json; echo; failed=$((failed+1))
                ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed of ${#jars[@]} uploads failed."
            exit 1
          fi
          echo "::notice::Modrinth sync: $published new version(s) published, $existed already existed, $failed failed."

      - name: Attach jars to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*.jar
