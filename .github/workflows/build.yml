name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build range jars
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      modver: ${{ steps.collect.outputs.modver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .gradle/loom-cache
            ~/.gradle/caches/fabric-loom
          key: loom-range-cache-v1
          restore-keys: |
            loom-range-cache-
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Build adapters and range jars
        run: |
          set -euo pipefail
          gradle() {
            ./gradlew --no-daemon -Dorg.gradle.jvmargs='-Xmx3G' --max-workers=1 "$@"
          }
          for task in \
            :versions:fabric-1_14:remapJar \
            :versions:fabric-1_15:remapJar \
            :versions:fabric-1_16:remapJar \
            :versions:fabric-1_16_1:remapJar; do gradle "$task"; done
          gradle :ranges:fabric-legacy:rangeJar
          for task in \
            :versions:fabric-1_17:remapJar \
            :versions:fabric-1_19:remapJar \
            :versions:fabric-1_19_3:remapJar \
            :versions:fabric-1_20:remapJar \
            :versions:fabric-1_20_2:remapJar; do gradle "$task"; done
          gradle :ranges:fabric-modern:rangeJar
          for task in \
            :versions:fabric-1_21:remapJar \
            :versions:fabric-1_21_2:remapJar \
            :versions:fabric-1_21_6:remapJar \
            :versions:fabric-1_21_9:remapJar \
            :versions:fabric-1_21_11:remapJar; do gradle "$task"; done
          gradle :ranges:fabric-current:rangeJar
          for task in \
            :versions:fabric-26_1:jar \
            :versions:fabric-26_2:jar \
            :versions:fabric-26_3:jar; do gradle "$task"; done
          gradle :ranges:fabric-26:rangeJar
          gradle :ranges:neoforge-legacy:rangeJar
          for task in \
            :versions:neoforge-1_20_5:jar \
            :versions:neoforge-1_21:jar \
            :versions:neoforge-1_21_2:jar \
            :versions:neoforge-1_21_6:jar \
            :versions:neoforge-1_21_9:jar \
            :versions:neoforge-1_21_11:jar; do gradle "$task"; done
          gradle :ranges:neoforge-current:rangeJar
          for task in \
            :versions:neoforge-26_1:jar \
            :versions:neoforge-26_2:jar \
            :versions:neoforge-26_3:jar; do gradle "$task"; done
          gradle :ranges:neoforge-26:rangeJar
      - name: Collect range jars
        id: collect
        run: |
          set -euo pipefail
          modver=$(sed -n 's/^mod_version=//p' gradle.properties)
          mkdir -p dist
          while IFS= read -r target; do
            source=$(jq -r .source <<<"$target")
            asset=$(jq -r .asset <<<"$target")
            cp "${source}-${modver}.jar" "dist/vzoom-${modver}-${asset}.jar"
          done < <(jq -c '.[]' .github/release-targets.json)
          test "$(find dist -maxdepth 1 -name '*.jar' | wc -l)" -eq 7
          echo "modver=$modver" >> "$GITHUB_OUTPUT"
      - name: Verify range jars
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import zipfile
          targets = json.loads(pathlib.Path('.github/release-targets.json').read_text())
          modver = next(line.split('=', 1)[1] for line in pathlib.Path('gradle.properties').read_text().splitlines() if line.startswith('mod_version='))
          files = sorted(pathlib.Path('dist').glob('*.jar'))
          if len(files) != len(targets):
              raise SystemExit('unexpected range jar count')
          for target in targets:
              path = pathlib.Path('dist') / f"vzoom-{modver}-{target['asset']}.jar"
              with zipfile.ZipFile(path) as jar:
                  names = jar.namelist()
                  if len(names) != len(set(names)):
                      raise SystemExit(f'duplicate entries in {path.name}')
                  if target['loader'] == 'fabric':
                      metadata = json.loads(jar.read('fabric.mod.json'))
                      if metadata['id'] != 'vzoom' or len(metadata['entrypoints']['client']) != 1:
                          raise SystemExit(f'invalid Fabric metadata in {path.name}')
                  else:
                      metadata = [name for name in names if name in {'mods.toml', 'neoforge.mods.toml'}]
                      if len(metadata) != 1:
                          raise SystemExit(f'invalid NeoForge metadata in {path.name}')
                  if 'vzoom.mixins.json' not in names or 'vzoom-range.properties' not in names and target['id'] != 'neoforge-1.20.2-1.20.4':
                      raise SystemExit(f'incomplete range jar {path.name}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vzoom-${{ steps.collect.outputs.modver }}-ranges
          path: dist/*.jar
          if-no-files-found: error

  release:
    name: Update rolling latest release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vzoom-${{ needs.build.outputs.modver }}-ranges
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Latest development builds" --notes "Automated builds from main."
          gh release upload latest --repo "$GITHUB_REPOSITORY" --clobber dist/*.jar

  modrinth:
    name: Publish range jars to Modrinth
    needs: build
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      MODRINTH_PROJECT: vextolyzoom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vzoom-${{ needs.build.outputs.modver }}-ranges
          path: dist
      - env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          if [ -z "${MODRINTH_TOKEN:-}" ]; then
            echo "::warning::MODRINTH_TOKEN is not set; skipping Modrinth publishing."
            exit 0
          fi
          modver='${{ needs.build.outputs.modver }}'
          changelog="${CHANGELOG:-Automated build from main: https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA}"
          changelog="${changelog:0:2000}"
          project_id=$(curl -fsSL "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT" | jq -r .id)
          failed=0
          while IFS= read -r target; do
            id=$(jq -r .id <<<"$target")
            loader=$(jq -r .loader <<<"$target")
            asset=$(jq -r .asset <<<"$target")
            game_versions=$(jq -c .game_versions <<<"$target")
            jar="dist/vzoom-${modver}-${asset}.jar"
            data=$(jq -n \
              --arg project_id "$project_id" \
              --arg name "vZoom ${modver} ${asset}" \
              --arg version_number "${modver}+${id}" \
              --arg changelog "$changelog" \
              --arg loader "$loader" \
              --arg file "$(basename "$jar")" \
              --argjson game_versions "$game_versions" \
              '{project_id: $project_id, name: $name, version_number: $version_number, changelog: $changelog, dependencies: [], game_versions: $game_versions, loaders: [$loader], featured: false, status: "listed", requested_status: "listed", release_channel: "release", file_parts: [$file]}')
            http=$(curl -sS -o /tmp/modrinth-response.json -w '%{http_code}' -X POST 'https://api.modrinth.com/v2/version' -H "Authorization: $MODRINTH_TOKEN" -H 'User-Agent: CallMeAlphabet/vZoom (https://github.com/CallMeAlphabet/vZoom)' -F "data=$data" -F "file=@$jar;filename=$(basename "$jar")")
            case "$http" in
              200|201) echo "Published $id" ;;
              400) grep -qi 'already.exist' /tmp/modrinth-response.json && echo "Already published $id" || { cat /tmp/modrinth-response.json; failed=$((failed + 1)); } ;;
              *) cat /tmp/modrinth-response.json; failed=$((failed + 1)) ;;
            esac
          done < <(jq -c '.[]' .github/release-targets.json)
          test "$failed" -eq 0
      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*.jar
