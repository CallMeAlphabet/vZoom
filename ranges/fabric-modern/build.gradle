plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT'
}

ext {
    rangeArchiveName = 'vzoom-fabric-1.17-1.20.6'
    rangeMinecraft = '1.20.5'
    rangeLoaderVersion = '0.16.14'
    rangeFabricApiVersion = '0.97.8+1.20.5'
    rangeModMenuVersion = '10.0.0-beta.1'
    rangeJavaVersion = 16
    rangeUseRemap = true
    rangeSourceDirectories = ['ranges/common/src/main/java', 'ranges/fabric-support/src/main/java', 'ranges/fabric-modmenu/src/main/java']
    rangeAdapterProjects = [[path: ':versions:fabric-1_17', useRemap: true], [path: ':versions:fabric-1_19', useRemap: true], [path: ':versions:fabric-1_19_3', useRemap: true], [path: ':versions:fabric-1_20', useRemap: true], [path: ':versions:fabric-1_20_2', useRemap: true]]
}

apply from: "$rootDir/ranges/fabric-range.gradle"
