pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net" }
        mavenCentral()
        gradlePluginPortal()
        maven { url = "https://maven.terraformersmc.com/releases" }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = "vZoom"


