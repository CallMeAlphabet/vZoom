pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net" }
        mavenCentral()
        gradlePluginPortal()
        maven { url = "https://maven.terraformersmc.com/releases" }
    }
}

plugins {
    // Allow Gradle to auto-provision JDK toolchains (e.g. Java 25 for MC 26.2).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = "vZoom"

include(":core")
include(":v1_21_11")
include(":v26_2")
